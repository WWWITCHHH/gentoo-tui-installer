name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Show tool versions
        run: |
          bash --version | head -n 1
          shellcheck --version

      - name: Check Bash syntax
        run: bash -n gentoo-installer lib/*.sh scripts/*.sh tests/*.sh tests/unit/*.sh

      - name: Run ShellCheck
        run: shellcheck -x -S warning -e SC2034 gentoo-installer lib/*.sh scripts/*.sh tests/*.sh tests/unit/*.sh

      - name: Run unit tests
        run: bash tests/run.sh

      - name: Validate release version
        run: |
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
          version=$(cat VERSION)
          grep -Fq "## [${version}] - " CHANGELOG.md

  package:
    name: Build release archive
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches VERSION
        run: |
          version=$(cat VERSION)
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Build archive
        env:
          DIST_DIR: dist
        run: ./scripts/release.sh

      - name: Upload archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
